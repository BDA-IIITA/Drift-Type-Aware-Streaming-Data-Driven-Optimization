[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "griddrift"
version = "0.1.0"
description = "Drift-aware streaming electricity-demand forecasting and dispatch simulation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["entsoe-py>=0.6"]
forecasting = ["scikit-learn>=1.4", "joblib>=1.3", "xgboost>=2.0,<4"]
drift = ["river>=0.21"]
optimization = ["pyomo>=6.7", "highspy>=1.7", "matplotlib>=3.8"]
dashboard = ["streamlit>=1.37", "plotly>=5.20"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
